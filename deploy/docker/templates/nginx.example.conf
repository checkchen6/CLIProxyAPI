# CLIProxyAPI Nginx 反向代理配置
# 用途：为 Docker 部署的 CLIProxyAPI 提供 HTTPS 访问和域名绑定
# 使用：复制到 /etc/nginx/conf.d/cliproxyapi.conf 并修改域名和证书路径

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # SSL 证书配置
    ssl_certificate /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    # SSL 安全配置（推荐）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 日志
    access_log /var/log/nginx/cliproxyapi-access.log;
    error_log /var/log/nginx/cliproxyapi-error.log;

    location / {
        # 反向代理到容器（容器绑定 127.0.0.1:8317）
        proxy_pass http://127.0.0.1:8317;

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（Codex 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 缓冲设置（流式响应场景建议关闭）
        proxy_buffering off;
        proxy_request_buffering off;

        # 客户端请求体大小限制（用于文件上传）
        client_max_body_size 100M;
    }
}

# HTTP 自动跳转 HTTPS（可选）
server {
    listen 80;
    server_name api.yourdomain.com;

    # ACME challenge（Let's Encrypt 证书续期）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他请求跳转 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
