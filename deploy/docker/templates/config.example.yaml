# ============================================================
# OAuth 提供商接入流程（Claude / Codex / Antigravity）
# ============================================================
# 1. 在 docker-compose.yml 中取消注释对应的回调端口
# 2. 建立 SSH 隧道：ssh -L 54545:127.0.0.1:54545 root@你的服务器
# 3. 访问管理面板：https://你的域名/management.html
# 4. 通过 OAuth 流程添加提供商账号
# 5. 凭据自动保存到 ./auths/ 目录
# 6. 关闭回调端口并重启容器
