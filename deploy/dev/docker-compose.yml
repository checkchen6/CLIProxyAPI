services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      # Paths here resolve against the Compose project directory, not this file's
      # location. The build scripts pin --project-directory to the repository
      # root, so "." is the repository root. When running docker compose by hand
      # from deploy/dev, pass --project-directory ../.. as well.
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      # Main API (OpenAI / Gemini / Claude compatible) plus management endpoints.
      - "8317:8317"
      # OAuth callback listeners. Each provider uses its own fixed port and they
      # are not interchangeable. Only needed while logging in through the
      # management panel; comment out the ones you do not use.
      - "54545:54545" # Anthropic / Claude
      - "1455:1455" # Codex
      - "51121:51121" # Antigravity
      # No listener in the codebase binds these; kept for backward compatibility
      # with existing deployments.
      # - "8085:8085"
      # - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
